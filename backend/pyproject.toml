[project]
name = "opencrew"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "python-dotenv",
    "pypdfium2>=5.13.0",
    "openpyxl>=3.1.5",
    "rapidfuzz>=3.14.6",
    "httpx>=0.28.1",
    "google-genai>=2.25.0",
    "pyshp>=3.1.6",
    "shapely>=2.1.2",
    "python-multipart>=0.0.32",
    "python-dateutil>=2.9.0.post0",
    "ortools>=9.15.6755",
    "trafilatura>=2.2.0",
    "pyjwt[crypto]>=2.15.0",
]

[dependency-groups]
dev = ["pytest"]
