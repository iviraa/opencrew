[package]
name = "crewly_bounty"
version = "0.1.0"
description = "Crewly damage-verification bounties: SOL escrow released by M-of-N reviewers (devnet only)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "crewly_bounty"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"

[dev-dependencies]
litesvm = "0.10.0"
solana-sdk = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
