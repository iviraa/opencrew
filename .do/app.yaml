name: opencrew
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: iviraa/opencrew
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
    routes:
      - path: /
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DB_SEARCH_PATH
        scope: RUN_TIME
        value: "planner, extensions, public"
      - key: SUPABASE_URL
        scope: RUN_TIME
      - key: SUPABASE_PUBLISHABLE_KEY
        scope: RUN_TIME
      - key: SUPABASE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: VITE_SUPABASE_URL
        scope: BUILD_TIME
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        scope: BUILD_TIME
      - key: CORS_ORIGINS
        scope: RUN_TIME
      - key: HAZARDS_REFRESH_MINUTES
        scope: RUN_TIME
        value: "180"
      - key: CREWLY_PROACTIVE_MINUTES
        scope: RUN_TIME
        value: "30"
      - key: LIVE_POLL_MINUTES
        scope: RUN_TIME
        value: "30"
      - key: CREWLY_MODEL_TIER
        value: auto
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: RESEND_FROM
        scope: RUN_TIME
      - key: COMMS_ALLOWED_DOMAINS
        scope: RUN_TIME
      - key: GOOGLE_PLACES_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DEMO_INBOX_UTILITY
        scope: RUN_TIME
        type: SECRET
