<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#5b2bb5"/>
  <!-- ears -->
  <circle cx="15" cy="27" r="6.5" fill="#a9683a"/>
  <circle cx="15" cy="27" r="3.2" fill="#e7a98a"/>
  <circle cx="49" cy="27" r="6.5" fill="#a9683a"/>
  <circle cx="49" cy="27" r="3.2" fill="#e7a98a"/>
  <!-- head -->
  <ellipse cx="32" cy="38" rx="19" ry="18" fill="#c98a54"/>
  <!-- muzzle -->
  <ellipse cx="32" cy="45" rx="11" ry="8.5" fill="#f6dcb8"/>
  <!-- eyes -->
  <circle cx="24.5" cy="35" r="3" fill="#1f120c"/>
  <circle cx="39.5" cy="35" r="3" fill="#1f120c"/>
  <circle cx="25.5" cy="34" r="1" fill="#fff"/>
  <circle cx="40.5" cy="34" r="1" fill="#fff"/>
  <!-- nose -->
  <ellipse cx="32" cy="41" rx="3.6" ry="2.6" fill="#4a2616"/>
  <!-- buck teeth -->
  <rect x="28.4" y="46" width="3.4" height="5.6" rx="0.8" fill="#fffaf0" stroke="#3a1a0e" stroke-width="0.8"/>
  <rect x="32.2" y="46" width="3.4" height="5.6" rx="0.8" fill="#fffaf0" stroke="#3a1a0e" stroke-width="0.8"/>
  <!-- hard hat -->
  <path d="M15 25 C15 12 49 12 49 25 Z" fill="#ffc62e"/>
  <rect x="11" y="23.5" width="42" height="4.5" rx="2.2" fill="#f2a91a"/>
  <rect x="30" y="12.5" width="4" height="11" rx="2" fill="#f2a91a"/>
